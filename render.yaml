services:
  - type: web
    name: tiffin-backend-api
    env: node
    plan: free
    region: singapore # or oregon / frankfurt
    buildCommand: npm install && npm run build:api
    startCommand: npm run start:api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES
        value: 15m
      - key: JWT_REFRESH_EXPIRES
        value: 7d
      - key: PAYMENT_PROVIDER
        value: mock
      - key: CORS_ORIGIN
        sync: false
      - key: TZ
        value: Asia/Kolkata
